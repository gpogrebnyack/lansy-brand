<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab · Lansy design tools</title>
<link rel="icon" href="../assets/icon/lansy-icon-ink.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Struve;src:url(../fonts/Struve-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Struve;src:url(../fonts/Struve-Medium.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Struve;src:url(../fonts/Struve-Semibold.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Supermarker;src:url(../fonts/Supermarker-MediumItalic.woff2) format('woff2');font-weight:500;font-style:italic;font-display:swap}
@font-face{font-family:Supermarker;src:url(../fonts/Supermarker-Italic.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
:root{--ink:#201F1D;--text2:#75736F;--grey:#8D8A86;--line:#E9E6E0;--sand:#F2EFE9;--paper:#FCF9F3;--n-card:linear-gradient(180deg,#F2EFE9 0%,#FCF9F3 100%)}
*{box-sizing:border-box;margin:0}
*,::before,::after{font-feature-settings:'ss10'}
body{background:#fff;color:var(--ink);font-family:Struve,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.lbl{font:500 11px/1.6 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.app{max-width:1200px;margin:0 auto}
.head .back{display:inline-block;margin-bottom:14px;color:var(--text2);text-decoration:none}.head h1{font-size:28px;font-weight:600;letter-spacing:-.01em}
.btn{height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--ink);color:#fff;font:500 13px Struve,sans-serif;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

.stage{padding:104px 40px 72px;display:flex;flex-direction:column;gap:24px}
.card{border-radius:24px;background:var(--n-card);padding:24px 28px;position:relative}
.card>.lbl{display:block;margin-bottom:14px}
.padhd{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 14px}.padhd .lbl{margin:0}
.pad{position:relative;height:320px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);touch-action:none;cursor:crosshair;overflow:hidden}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad .tip{position:absolute;left:16px;bottom:12px;font-size:13px;color:var(--grey);pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px 10px}
.tile canvas{display:block;width:100%;height:220px}
.scenes figure.wide{grid-column:1/-1}.scenes figure.wide .sq{aspect-ratio:2/1}
.scenes{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.scenes figure{margin:0;position:relative}
/* a post's settings hide behind a button that shows on hover (always on touch); the panel floats over the post */
.gear{position:absolute;top:12px;right:12px;z-index:3;height:34px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 0 var(--line),0 6px 20px rgba(32,31,29,.12);font:500 13px Struve,sans-serif;color:var(--ink);cursor:pointer;opacity:0;transition:opacity .15s}
.scenes figure:hover .gear{opacity:1}@media (hover:none){.gear{opacity:1}}
/* the panel docks to the bottom of the screen, so the post stays in view while it is tuned */
.scenes figure .knobs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:42vh;overflow:auto;padding:14px max(24px,calc((100vw - 1200px)/2 + 40px)) 18px;border-radius:20px 20px 0 0;background:#fff;box-shadow:0 0 0 1px var(--line),0 -12px 36px rgba(32,31,29,.14);gap:4px 28px}
.khead{flex:1 1 100%;display:flex;align-items:center;gap:8px;margin-bottom:6px}.khead .lbl{margin-right:auto}.kcopy{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;cursor:pointer}.kclose{height:32px;padding:0 14px;border-radius:999px;border:0;background:var(--ink);color:#fff;font:500 13px Struve,sans-serif;cursor:pointer}
.scenes figure.open .knobs{display:flex}.scenes figure.open .knobs .f{flex:1 1 calc(50% - 14px)}.scenes figure.open .knobs .prow{flex:1 1 100%}
@media (max-width:700px){.scenes figure.open .knobs .f{flex:1 1 100%}}.scenes figcaption{margin:12px 0 4px}
.sq{display:block;width:100%;aspect-ratio:1;border-radius:16px;box-shadow:0 0 0 1px var(--line)}
.postctl{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}.postctl .row{display:flex;align-items:center;gap:12px;color:var(--text2);font-size:13px}.postctl .row>span{flex:0 0 72px}
.postctl input[type=text]{flex:1;max-width:520px;height:34px;padding:0 12px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:#fff;font:400 14px Struve,sans-serif;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{height:30px;padding:0 12px;border-radius:999px;border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font:500 13px Struve,sans-serif;color:var(--ink);cursor:pointer}.seg button.on{background:var(--ink);color:#fff;box-shadow:none}
.knobs{display:flex;flex-wrap:wrap;gap:4px 20px}.knobs .f{flex:1 1 100%}.knobs .prow{flex:1 1 100%;display:flex;align-items:center;gap:8px;margin:2px 0 4px;color:var(--text2);font-size:13px}.prow>span{flex:0 0 72px}.f{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px}.f span{flex:0 0 72px}#k-all .f{flex:none}.f input{flex:1;min-width:0;accent-color:var(--ink)}.f output{font:500 11px "JetBrains Mono",monospace;min-width:24px}
@media (max-width:1000px){.tiles,.scenes{grid-template-columns:1fr}.tile canvas{height:260px}.stage{padding:20px 16px 56px}}
html.solo body>*:not(.solo-badge){display:none!important}html.solo,html.solo body{background:#fff;overflow:hidden}
html.solo body>canvas.solo-c{display:block!important;position:fixed;left:0;top:0;width:100vw;height:100vw;border-radius:0;box-shadow:none}html.solo body>canvas.solo-c.wide{height:50vw}html.solo body>canvas#solo{height:100vh}html.clear,html.clear body{background:transparent!important}
</style>
</head>
<body>
<script src="../nav.js"></script>
<div class="app">

<main class="stage">
  <header class="head"><h1>Lab: the pen and the blobs</h1></header>
  <section class="card"><div class="padhd"><span class="lbl">Draw</span><button class="btn ghost" id="clear">Clear</button></div><div class="pad" id="pad"><canvas id="cv"></canvas><span class="tip">Draw with a mouse or a stylus</span></div></section>
  <section class="card"><span class="lbl">Our shapes</span><div class="tiles" id="tiles"></div></section>
  <section class="card"><div class="padhd"><span class="lbl">Random blobs</span><span><button class="btn ghost" id="showpath">Show path</button> <button class="btn" id="reroll">New blobs</button></span></div><div class="tiles" id="rtiles"></div></section>
  <section class="card"><span class="lbl">Square post</span>

    <div class="scenes" id="scenes">
    </div></section>
</main>
</div>

<script>
const QS=new URLSearchParams(location.search), SOLO=QS.get('solo');
if(SOLO||QS.has('shape'))document.documentElement.classList.add('solo');
if(QS.has('clear'))document.documentElement.classList.add('clear');   // export on transparency (the page's own ground shows through)
const $=id=>document.getElementById(id), INK='#201F1D', PAD_REF=120;   // the pad counts as a shape 120 px tall
// the pen, fixed after the lab (2026-10-12): width as % of the shape's height, angle °, nib thickness and roundness, end lean °
const PEN={w:27,a:35,t:.12,r:8,l:45};
const strokes=[], SMOOTH=.5;   // a stroke is a list of [x, y, pressure]; smoothing stays at the Working value

// ---- geometry
const smooth=(pts,k)=>{if(k<=0||pts.length<3)return pts; const n=Math.round(1+k*6), out=[];   // moving average over ±n points; ends stay put
  for(let i=0;i<pts.length;i++){let x=0,y=0,p=0,c=0; for(let j=Math.max(0,i-n);j<=Math.min(pts.length-1,i+n);j++){x+=pts[j][0];y+=pts[j][1];p+=pts[j][2];c++;} out.push([x/c,y/c,p/c]);}
  out[0]=pts[0]; out[out.length-1]=pts[pts.length-1]; return out;};
const resample=(pts,step)=>{const out=[pts[0]]; let acc=0;
  for(let i=1;i<pts.length;i++){const [x0,y0,p0]=pts[i-1],[x1,y1,p1]=pts[i], d=Math.hypot(x1-x0,y1-y0); if(!d)continue; let t=step-acc;
    while(t<=d){const u=t/d; out.push([x0+(x1-x0)*u,y0+(y1-y0)*u,p0+(p1-p0)*u]); t+=step;} acc=d-(t-step);}
  if(out.length<2)out.push(pts[pts.length-1]); return out;};
const hull=P=>{P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]), L=[],U=[];
  for(const p of P){while(L.length>1&&cr(L[L.length-2],L[L.length-1],p)<=0)L.pop(); L.push(p);}
  for(const p of P.reverse()){while(U.length>1&&cr(U[U.length-2],U[U.length-1],p)<=0)U.pop(); U.push(p);} return L.slice(0,-1).concat(U.slice(0,-1));};
const poly=(ctx,P)=>{ctx.beginPath(); ctx.moveTo(P[0][0],P[0][1]); for(const q of P.slice(1))ctx.lineTo(q[0],q[1]); ctx.closePath(); ctx.fill();};

// broad nib: a W×T nib held at angle a, swept along the path; each step fills the hull of the nib at both points.
// The nib's outline is a superellipse |x|^n + |y|^n = 1: a rectangle's corners leave facets on every bend, a squircle's don't
function drawNib(ctx,pts,W,a,T,n){const ca=Math.cos(a),sa=Math.sin(a), K=40, unit=[];
  for(let i=0;i<K;i++){const th=i/K*2*Math.PI, c=Math.cos(th), s=Math.sin(th); unit.push([Math.sign(c)*Math.abs(c)**(2/n),Math.sign(s)*Math.abs(s)**(2/n)]);}
  const nib=([x,y])=>{const w=W/2, t=w*T; return unit.map(([u,v])=>[x+ca*u*w-sa*v*t,y+sa*u*w+ca*v*t]);};
  // clean ends: near each end the nib print is clipped by the cut line (through the end point, along the pen angle), so nothing
  // sticks out past it. Clipping the print, not erasing the canvas, can't bite other parts of the stroke (a closed loop, a crossing)
  const cuts=endCuts(pts,a), dist=[0];
  for(let i=1;i<pts.length;i++) dist.push(dist[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const total=dist[dist.length-1];
  const print=i=>{let P=nib(pts[i]); for(const c of cuts){const from=c.start?dist[i]:total-dist[i]; if(from<W*1.5) P=clip(P,c);} return P;};
  let prev=print(0); for(let i=1;i<pts.length;i++){const cur=print(i); if(prev.length>2&&cur.length>2) poly(ctx,hull([...prev,...cur])); prev=cur;}
  // where the end cut lies ahead of the nib's own edge, the stroke would stop short of it and leave a step; so each end is carried
  // straight on along its direction and cut there: the end is always one flat edge
  for(const c of cuts){const e=c.start?0:pts.length-1, P=nib(pts[e]), Q=P.map(([x,y])=>[x+c.d[0]*W*2,y+c.d[1]*W*2]), H=clip(hull([...P,...Q]),c);
    if(H.length>2) poly(ctx,H);}}

// the cut at an end: square to the stroke, turned toward the pen angle by at most `lean`. A cut right along the pen angle would run
// almost lengthwise on strokes near that angle and leave a long wedge. Returns the end point, the cut's direction c and outward normal m
function endCut(pts,e,b,a,lean){const [x,y]=pts[e], dx=x-pts[b][0], dy=y-pts[b][1], L=Math.hypot(dx,dy)||1, d=[dx/L,dy/L];
  const sq=Math.atan2(d[0],-d[1]);   // the square cut's direction (the stroke's normal)
  const diff=((a-sq)%Math.PI+1.5*Math.PI)%Math.PI-Math.PI/2;   // the pen angle relative to it, folded into ±90° (a line has no direction)
  const t=sq+Math.sign(diff)*Math.min(Math.abs(diff),lean), c=[Math.cos(t),Math.sin(t)];
  let m=[-c[1],c[0]]; if(m[0]*d[0]+m[1]*d[1]<0) m=[-m[0],-m[1]]; return {x,y,c,m,d};}
function endCuts(pts,a){const n=pts.length-1, k=Math.min(4,n), lean=PEN.l*Math.PI/180;
  return [Object.assign(endCut(pts,0,k,a,lean),{start:true}),Object.assign(endCut(pts,n,n-k,a,lean),{start:false})];}
// keep the part of a convex polygon on the inner side of a cut (Sutherland–Hodgman against one half-plane)
function clip(P,{x,y,m}){const f=p=>(p[0]-x)*m[0]+(p[1]-y)*m[1], out=[];
  for(let i=0;i<P.length;i++){const p=P[i], q=P[(i+1)%P.length], fp=f(p), fq=f(q);
    if(fp<=0) out.push(p); if((fp<0&&fq>0)||(fp>0&&fq<0)){const t=fp/(fp-fq); out.push([p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t]);}}
  return out;}

const layer=document.createElement('canvas'), lx=layer.getContext('2d');
// the pen width is a share of the shape's height (refH, in screen pixels), so a shape looks the same at any size
function render(ctx,pts,refH=PAD_REF){if(pts.length<2)return; const W=PEN.w/100*refH, a=PEN.a*Math.PI/180;
  const P=resample(smooth(pts,SMOOTH),Math.max(.8,W/24)), c=ctx.canvas;
  if(layer.width!==c.width||layer.height!==c.height){layer.width=c.width; layer.height=c.height;}
  lx.setTransform(ctx.getTransform()); lx.save(); lx.setTransform(1,0,0,1,0,0); lx.clearRect(0,0,layer.width,layer.height); lx.restore();
  lx.fillStyle=INK; drawNib(lx,P,W,a,PEN.t,PEN.r);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(layer,0,0); ctx.restore();}

// ---- the drawing pad
const cv=$('cv'), cx=cv.getContext('2d'); let cur=null;
function size(c){const r=c.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1); c.width=r.width*d; c.height=r.height*d; c.getContext('2d').setTransform(d,0,0,d,0,0);}
function redraw(){cx.save(); cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,cv.width,cv.height); cx.restore(); for(const s of strokes) render(cx,s); if(cur) render(cx,cur);}
const at=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top,.5];};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId); cur=[at(e)]; $('pad').querySelector('.tip').style.display='none';});
cv.addEventListener('pointermove',e=>{if(!cur)return; for(const ev of (e.getCoalescedEvents?e.getCoalescedEvents():[e])) cur.push(at(ev)); redraw();});
cv.addEventListener('pointerup',()=>{if(cur&&cur.length>1)strokes.push(cur); cur=null; redraw();});

// ---- set shapes: sampled from SVG paths, drawn with the same pen at the same width
const SHAPES=[['Landing scribble A','../assets/line/scribble-a.svg'],['Landing scribble B','../assets/line/scribble-b.svg'],
  ['Underline',null,'M10 70 C 80 58, 170 56, 250 66']];   // our three: the landing's two scribbles and the line (a liked generated blob is kept in assets/line/blob-1876.svg)
const sample=(d,n=260)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',d); const L=p.getTotalLength(), out=[];
  for(let i=0;i<=n;i++){const q=p.getPointAtLength(L*i/n); out.push([q.x,q.y,.5]);} return out;};
const tiles=[], SQ={file:'../assets/line/blob-1876.svg'};   // the post's blob: the kept 1876

// ---- random blobs: variations of the two landing scribbles, not invented gestures. Guessing a hand from parameters kept giving
// something else (bricks, then wings); the references already hold the hand: its turns, the bow of each stroke, the rhythm.
// A variation takes A or B as drawn and changes it smoothly: a small turn and stretch, a slow wave in the swing along the travel
// (strokes longer here, shorter there), a gentle warp of the whole, sometimes a trimmed start, sometimes a curved flick for an end
function rng(seed){let a=seed>>>0||1; return ()=>{a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296;};}
function blob(seed){const r=rng(seed), R=(a,b)=>a+(b-a)*r(), pen=PEN.a*Math.PI/180, rotPre=(()=>{const q=rng(seed^0x9e3779b9)(); return (q*30-15)*Math.PI/180;})(), base=tiles[r()<.5?0:1].pts.map(p=>[p[0],p[1]]), N=base.length;
  // the stroke direction (cross): the main axis of the path's tangents; the travel (along) is square to it
  let sxx=0,sxy=0,syy=0; for(let i=1;i<N;i++){const dx=base[i][0]-base[i-1][0], dy=base[i][1]-base[i-1][1], L=Math.hypot(dx,dy)||1, x=dx/L, y=dy/L; sxx+=x*x; sxy+=x*y; syy+=y*y;}
  const th=.5*Math.atan2(2*sxy,sxx-syy), c=[Math.cos(th),Math.sin(th)], a=[-c[1],c[0]];
  const cx=base.reduce((m,p)=>m+p[0],0)/N, cy=base.reduce((m,p)=>m+p[1],0)/N;
  let uv=base.map(([x,y])=>[(x-cx)*a[0]+(y-cy)*a[1],(x-cx)*c[0]+(y-cy)*c[1]]);
  const us=uv.map(q=>q[0]), u0=Math.min(...us), u1=Math.max(...us), span=u1-u0||1;
  // a slow wave in the swing, a stretch along the travel, a gentle warp
  const amp=R(.12,.3), freq=R(.6,1.4), ph=R(0,6.3), su=R(.85,1.25), sv=R(.9,1.15), warp=R(-.18,.18), lift=R(-.12,.12);
  uv=uv.map(([u,v])=>{const t=(u-u0)/span, g=1+amp*Math.sin(2*Math.PI*freq*t+ph); return [u*su, v*sv*g + warp*span*Math.sin(Math.PI*t) + lift*u];});
  // the turns: where the swing (v) reverses — local extremes, read on a light smoothing so wobble isn't taken for a turn
  const vs=uv.map((q,i)=>{let m=0,c=0; for(let j=Math.max(0,i-4);j<=Math.min(N-1,i+4);j++){m+=uv[j][1];c++;} return m/c;}), turns=[];
  for(let i=2;i<N-2;i++) if((vs[i]-vs[i-1])*(vs[i+1]-vs[i])<0) turns.push(i);
  // a wobble in the scribble reads as two turns close in swing; it made the 'last whole stroke' a tiny hook at the end. Drop any pair of
  // neighbouring turns whose swing between them is under a third of the median swing (strokes vary in length; wobbles are far smaller)
  {const sw=i=>Math.abs(vs[turns[i]]-vs[turns[i-1]]); const all=[]; for(let i=1;i<turns.length;i++)all.push(sw(i)); all.sort((p,q)=>p-q); const med=all[all.length>>1]||0;
    for(let changed=true;changed;){changed=false; for(let i=1;i<turns.length;i++)if(sw(i)<med*.33){turns.splice(i-1,2); changed=true; break;}}}
  // trim the start, sometimes — always at a turn, as if the hand set off from there (a cut mid-stroke left a stub and a hairline)
  let from=0; if(r()<.4){const pick=R(.04,.16); if(turns.length>2) from=turns[pick<.1?0:1];}
  // a lead-in (start to the first turn) longer than a third of the travel would read as a stray tail: shorten it
  const t0=turns.find(i=>i>from); if(t0!=null){let L=0, k=t0; while(k>from){L+=Math.hypot(uv[k][0]-uv[k-1][0],uv[k][1]-uv[k-1][1]); if(L>span*su*.33) break; k--;} from=Math.max(from,k);}
  // a lead-out (the last turn to the end) longer than a third of the travel is shortened too
  let to=N; const tl=[...turns].reverse().find(i=>i<N-1&&i>from); if(tl!=null){let L=0, k=tl; while(k<N-1){L+=Math.hypot(uv[k+1][0]-uv[k][0],uv[k+1][1]-uv[k][1]); if(L>span*su*.33) break; k++;} to=Math.min(N,k+1);}
  let P=uv.slice(from,to);
  // replace the end with a flick, sometimes. A broad nib's width follows the direction, so a tail that bends changes width on the way;
  // the references' tails run nearly straight. So the flick bends by a few degrees at most, and runs at least 45° off the pen edge
  // a flick carries the last stroke on: it leaves along the stroke's own tangent and turns by 25° at most (a hand doesn't swing
  // round to a new direction for a flourish). If every direction in that range would put the pen on its hairline edge, no flick
  // the end: always cut inside the last whole stroke (between its two turns). The scribble's own tail, turned and warped by the
  // variation, could point anywhere and stop reading as the hand's movement; past the cut the stroke either just ends, or flicks on
  const tp=turns.map(i=>i-from).filter(i=>i>0&&i<P.length-1), endCut=R(.5,.85);
  // measured along the stroke, not by point count: points crowd at the turns, so a cut at half the points left a stub of a third
  if(tp.length>=2){const tA=tp[tp.length-2], tB=tp[tp.length-1], seg=i=>Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);
    let L=0; for(let i=tA;i<tB;i++)L+=seg(i); let k=tA, run=0; while(k<tB&&run+seg(k)<L*endCut){run+=seg(k); k++;} P=P.slice(0,k+1);}
  // the ends: a run along the pen's edge draws as a hairline sliver, and a tight turn in the last few points as a little hook. Trim

const newBlob=o=>{o.seed=Math.floor(Math.random()*1e6); o.gen=blob(o.seed);};   // pressing New again rolls another
function knobs(){for(const o of POSTS){if(o.layout==='spec')continue; const h='k-'+o.id, O=o.people; $(h).innerHTML=`<div class="khead"><span class="lbl">${o.name}</span><button class="kcopy" type="button" data-id="${o.id}">Copy settings</button><button class="kclose" type="button">Close</button></div>`;
  // the highlighter lives on light grounds and on Lime (a white highlighter there); not on Dark — no version of it read well there
  pick(h,o,'bg','Background',[['floor','Floor'],['card','Card'],['lime','Lime'],...(o.layout==='quote'||o.layout==='line'?[]:[['dark','Dark']])]);
  if(o.layout==='quote'){pick(h,o,'hl','Quote',QUOTES.map((l,i)=>[String(i),l.replace(/\*/g,'').slice(0,34)+'…'])); pick(h,o,'ink','Line',[['white','White'],['lime','Lime'],['paper','Paper']]); pick(h,o,'avatar','Photo',[['on','With photo'],['off','Without']]); knob(h,o,'thick','Thickness',20,120); continue;}
  if(o.layout==='line'){pick(h,o,'hl','Fact',FACTS.map((f,i)=>[String(i),f.num+' · '+f.text.replace(/\*/g,'').slice(0,26)+'…'])); pick(h,o,'ink','Line',[['lime','Lime'],['white','White'],['paper','Paper']]); knob(h,o,'thick','Thickness',20,120); continue;}
  if(o.layout==='hero'){pick(h,o,'count','Blobs',[['one','One'],['two','Two · Omar at the end'],['two2','Omar · conversation | becomes'],['two3','Omar · for | your team']]); pick(h,o,'head','Inner head',[['in','Inside the blob'],['out','Out of it']]); pick(h,o,'fill','Blob fill',[['photo','Photo'],['floor','Floor'],['card','Card'],['lime','Lime'],['dark','Dark']]);
    o.blobs.forEach((b,i)=>pick(h,b,'shape',i?'Two people':'One person',[['a','A'],['b','B'],['kept','1876'],['gen',()=>b.gen?`New · ${b.seed}`:'New']],v=>{if(v==='gen')newBlob(b);}));
    knob(h,o,'small','Blob height',80,260); knob(h,o,'ppl','People',60,260); knob(h,o,'pin','Inner person',60,260); knob(h,o,'py','People Y',-60,60); continue;}
  pick(h,o,'hl','Headline',HEADS[o.cast].map((l,i)=>[String(i),l.join(' ').replace(/\*/g,'')]));
  pick(h,o,'shape','Blob',[['a','A'],['b','B'],['kept','1876'],['gen',()=>o.gen?`New · ${o.seed}`:'New']],v=>{if(v==='gen')newBlob(o);});
  pick(h,o,'fill','Blob fill',[['photo','Photo'],['floor','Floor'],['card','Card'],['lime','Lime'],['dark','Dark']]);
  knob(h,o.blob,'size','Blob size',30,140); knob(h,o.blob,'x','Blob X',0,100); knob(h,o.blob,'y','Blob Y',0,100);
  knob(h,O,'size','People size',20,120); knob(h,O,'x','People X',10,90); knob(h,O,'y','People Y',-30,30); if('close' in O)knob(h,O,'close','Closer',0,20);}}
knobs();
function all(){redraw(); drawTiles();}
$('clear').onclick=()=>{strokes.length=0; redraw(); $('pad').querySelector('.tip').style.display='';};
addEventListener('resize',()=>{size(cv); all();});

$('reroll').onclick=reroll;
$('showpath').onclick=()=>{SHOWPATH=!SHOWPATH; $('showpath').textContent=SHOWPATH?'Hide path':'Show path'; drawTiles();};
(async()=>{size(cv); await buildTiles(); reroll();
  {const t=await fetch(SQ.file).then(r=>r.text()); SQ.pts=sample(t.match(/ d="([^"]+)"/)[1]); SQ.vb=t.match(/viewBox="([^"]+)"/)[1].split(/\s+/).map(Number);}
  if(QS.has('shape'))drawSolo(); else if(SOLO)drawSquare(); else all();})();
// ---- export mode, for the brand page's examples (rendered by headless Chrome into PNGs, so they are exactly the lab's):
//   ?solo=<post id>&set=<json>  one post over the whole window, with the JSON merged into its settings
//   ?shape=a|b|kept|<seed>&path=1  one shape drawn with the pen, ink on white, the pen's path over it in lime
function drawSolo(){const c=$('solo'), x=c.getContext('2d'); size(c); const r=c.getBoundingClientRect(), k0=QS.get('shape');
  const t=k0==='a'?tiles[0]:k0==='b'?tiles[1]:k0==='kept'?SQ:k0==='line'?tiles[2]:blob(+k0), pad=r.width*.12, k=Math.min((r.width-2*pad)/t.vb[2],(r.height-2*pad)/t.vb[3]);
  x.fillStyle='#FFFFFF'; x.fillRect(0,0,r.width,r.height); const ox=(r.width-t.vb[2]*k)/2-t.vb[0]*k, oy=(r.height-t.vb[3]*k)/2-t.vb[1]*k, pts=t.pts.map(([a,b,p])=>[ox+a*k,oy+b*k,p]);
  render(x,pts,t.vb[3]*k);
  if(QS.get('path')){const P=smooth(pts,SMOOTH); x.strokeStyle='#9CDE45'; x.lineWidth=r.width*.004; x.lineJoin=x.lineCap='round'; x.beginPath(); P.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b)); x.stroke(); x.fillStyle='#9CDE45'; x.beginPath(); x.arc(P[0][0],P[0][1],r.width*.012,0,7); x.fill();}
  document.documentElement.dataset.ready='1';}
</script>
